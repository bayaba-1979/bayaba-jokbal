<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="족발 비즈니스 솔루션 연구소 — 3D 온톨로지 지식그래프. data/ontology.json + data/stores.json 실데이터 기반.">
<meta name="theme-color" content="#0a0908">
<meta name="application-name" content="족발 비즈니스 솔루션 연구소">
<meta property="og:title" content="족발 비즈니스 솔루션 연구소">
<meta property="og:description" content="실데이터(JSON DB)로 그리는 3D 온톨로지 연구 과제 트리. 침샘족발 카운터 스터디 케이스.">
<title>족발 비즈니스 솔루션 연구소</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="족발 연구소">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
:root{
  --bg:#080706; --panel:#12100d; --panel2:#1a1712; --bdr:#2a241b;
  --gold:#d4af37; --gold2:#e0c88a; --bronze:#c9a96e; --crimson:#e85d4c; --teal:#3db8a8; --blue:#5b8fd6;
  --ink:#ede6d8; --ink2:#a99c88; --ink3:#6b5f4e;
  --serif:'Noto Serif KR',serif; --sans:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;z-index:0}
#scene canvas{display:block}

/* ── 상단 바 ── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:14px 22px;background:linear-gradient(rgba(8,7,6,.92),rgba(8,7,6,.5) 70%,transparent);pointer-events:none}
.topbar .brand{display:flex;align-items:center;gap:11px;pointer-events:auto}
.topbar .logo{width:40px;height:40px;background:linear-gradient(135deg,#1d1912,#2a2318);border:1.5px solid var(--gold);border-radius:11px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;color:var(--gold2);font-size:1.05rem}
.topbar .brand h1{font-family:var(--serif);font-size:1.02rem;font-weight:900;color:var(--gold2);letter-spacing:.02em;line-height:1.15}
.topbar .brand span{display:block;font-size:.56rem;font-weight:400;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}
.topbar .hint{margin-left:auto;font-size:.62rem;color:var(--ink3);letter-spacing:.06em;pointer-events:auto;text-align:right}
.topbar .hint b{color:var(--bronze)}

/* ── 데이터 소스 표시 ── */
.dsrc{position:fixed;top:64px;right:16px;z-index:20;font-size:.55rem;color:var(--ink3);letter-spacing:.04em;text-align:right;line-height:1.7;pointer-events:none}
.dsrc b{color:var(--teal)}

/* ── 범례 ── */
.legend{position:fixed;left:22px;bottom:22px;z-index:20;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.legend .li{display:flex;align-items:center;gap:8px;font-size:.62rem;color:var(--ink2);letter-spacing:.04em}
.legend .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor}

/* ── 노드 라벨 (CSS2D) ── */
.node-label{pointer-events:auto;cursor:pointer;white-space:nowrap;transform:translate(-50%,-50%);
  font-size:.68rem;font-weight:600;letter-spacing:.02em;color:var(--ink);padding:6px 11px;border-radius:20px;
  background:rgba(18,16,13,.72);border:1px solid var(--bdr);backdrop-filter:blur(6px);transition:.2s}
.node-label:hover{color:#0a0908;background:var(--gold);border-color:var(--gold)}
.node-label.case{color:#ffb3a6;border-color:rgba(232,93,76,.5)}
.node-label.case:hover{color:#fff;background:var(--crimson);border-color:var(--crimson)}
.node-label.root{font-family:var(--serif);font-weight:900;font-size:.8rem;color:var(--gold2);border-color:rgba(212,175,55,.5)}
.node-label.root:hover{color:#0a0908;background:var(--gold2);border-color:var(--gold2)}

/* ── 상세 패널 ── */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);z-index:30;
  background:var(--panel);border-left:1px solid var(--bdr);transform:translateX(105%);
  transition:transform .4s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;
  box-shadow:-30px 0 60px rgba(0,0,0,.5)}
.panel.open{transform:translateX(0)}
.panel-head{padding:22px 24px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;gap:12px}
.panel-head .ico{font-size:1.4rem;line-height:1}
.panel-head .t{flex:1}
.panel-head .crumb{font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.panel-head h2{font-family:var(--serif);font-size:1.25rem;font-weight:900;color:var(--gold2);line-height:1.3}
.panel-close{flex-shrink:0;width:34px;height:34px;border:1px solid var(--bdr);border-radius:9px;background:none;color:var(--ink2);font-size:1rem;cursor:pointer;display:grid;place-items:center;transition:.2s}
.panel-close:hover{color:#0a0908;background:var(--crimson);border-color:var(--crimson)}
.panel-body{flex:1;overflow-y:auto;padding:22px 24px 40px;font-size:.84rem;line-height:1.75;color:var(--ink2)}
.panel-body h3{font-family:var(--serif);color:var(--gold2);font-size:1rem;margin:18px 0 8px}
.panel-body h3:first-child{margin-top:0}
.panel-body p{margin-bottom:10px}
.panel-body b{color:var(--ink)}
.panel-body ul{list-style:none;margin:8px 0}
.panel-body li{position:relative;padding-left:16px;margin-bottom:7px}
.panel-body li::before{content:'▸';position:absolute;left:0;color:var(--bronze)}
.panel-body .tbl{width:100%;border-collapse:collapse;font-size:.74rem;margin:8px 0}
.panel-body .tbl th,.panel-body .tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bdr);vertical-align:top}
.panel-body .tbl th{color:var(--bronze);font-size:.68rem;letter-spacing:.04em}
.panel-body .hl{color:var(--gold2)}
.panel-body .warn{color:var(--crimson)}
.panel-body .ok{color:var(--teal)}

/* 원가 계산기 */
.calc{background:var(--panel2);border:1px solid var(--bdr);border-radius:12px;padding:16px;margin:10px 0}
.c-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.c-row label{font-size:.72rem;color:var(--ink2);min-width:86px}
.c-row input{flex:1;min-width:80px;background:#0d0b09;border:1px solid var(--bdr);color:var(--ink);padding:9px 12px;border-radius:8px;font-size:.9rem;font-family:var(--mono);outline:none}
.c-row input:focus{border-color:var(--gold)}
.c-row .unit{font-size:.7rem;color:var(--ink3)}
.c-row .c-arrow{font-size:.7rem;color:var(--ink3)}
.c-row b{color:var(--gold2);font-family:var(--mono);font-size:.95rem}
.c-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.c-box{background:#0d0b09;border:1px solid var(--bdr);border-radius:9px;padding:12px 8px;text-align:center}
.c-val{font-family:var(--mono);font-size:1.15rem;font-weight:700;color:var(--gold2)}
.c-lbl{font-size:.56rem;color:var(--ink3);letter-spacing:.06em;margin-top:4px;text-transform:uppercase}
.note2{margin-top:10px;padding:10px 12px;border:1px dashed var(--bdr);border-radius:8px;font-size:.7rem;color:var(--ink3);line-height:1.6}

#boot{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg);color:var(--ink3);font-size:.8rem;letter-spacing:.1em;transition:opacity .5s}
#boot.hide{opacity:0;pointer-events:none}
@media(max-width:640px){.topbar .hint{display:none}.panel{width:100vw}.dsrc{display:none}}
</style>
</head>
<body>
<div id="scene"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">족</div>
    <h1>족발 비즈니스 솔루션 연구소<span>Jokbal Solution Lab · Ontology</span></h1>
  </div>
  <div class="hint">🖱️ 드래그 회전 · 휠 줌 · <b>노드 클릭</b>해 진입</div>
</header>
<div class="dsrc">데이터 소스<br><b id="srcStatus">로딩 중…</b></div>

<div class="legend">
  <div class="li"><span class="dot" style="color:#d4af37;background:#d4af37"></span>연구소 / 루트</div>
  <div class="li"><span class="dot" style="color:#3db8a8;background:#3db8a8"></span>연구 과제 트레일</div>
  <div class="li"><span class="dot" style="color:#e85d4c;background:#e85d4c"></span>케이스 · 침샘족발</div>
  <div class="li"><span class="dot" style="color:#c9a96e;background:#c9a96e"></span>세부 분석</div>
</div>

<aside class="panel" id="panel">
  <div class="panel-head">
    <div class="ico" id="pIco">📄</div>
    <div class="t"><div class="crumb" id="pCrumb"></div><h2 id="pTitle"></h2></div>
    <button class="panel-close" id="pClose" aria-label="닫기">✕</button>
  </div>
  <div class="panel-body" id="pBody"></div>
</aside>

<div id="boot">온톨로지 DB 로딩 중…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ================= 실제 데이터 로드 (data/ontology.json + data/stores.json) =================
let storesData = null;
let TREE = null;

async function loadOntology(){
  const [onto, stores] = await Promise.all([
    fetch('data/ontology.json').then(r=>r.json()),
    fetch('data/stores.json').then(r=>r.json()).catch(()=>null)
  ]);
  storesData = stores;
  return onto;
}

function buildTree(onto){
  const nodes = (onto.nodes||[]).map(n=>({...n, children:[]}));
  const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
  nodes.forEach(n=>{ if(n.rel && byId[n.rel.to]) byId[n.rel.to].children.push(n); });
  return nodes.find(n=>!n.rel) || nodes[0];
}

function storeContent(s){
  if(!s) return '<p class="warn">데이터 없음</p>';
  const menus = (s.menu||[]).map(cat =>
    `<div><b>${cat.category}</b> — ` +
    cat.items.filter(i=>i.price!=null).map(i=>`${i.name} ${i.price.toLocaleString('ko-KR')}원`).join(' · ') +
    `</div>`
  ).join('');
  return `<h3>${s.name}</h3><ul>
    <li><b>주소</b> ${s.address||'-'}</li>
    <li><b>영업</b> ${s.hours||'-'}</li>
    <li><b>브랜드</b> ${s.brand||'-'}</li></ul>
    <p>${menus || '<span class="warn">메뉴 조사 필요</span>'}</p>
    <p class="ok">✓ 출처: data/stores.json (실데이터)</p>`;
}

function priceTable(){
  const rows=[];
  (storesData?.stores||[]).forEach(s => (s.menu||[]).forEach(cat => cat.items.forEach(i=>{
    if(i.price!=null && i.cost!=null){
      const mr = ((i.price-i.cost)/i.price*100).toFixed(0);
      rows.push(`<tr><td>${i.name}</td><td>${i.price.toLocaleString('ko-KR')}원</td><td>${i.cost.toLocaleString('ko-KR')}원</td><td class='ok'>${mr}%</td></tr>`);
    }
  })));
  return rows.join('') || '<tr><td colspan="4" class="warn">원가 데이터 없음</td></tr>';
}

// ================= 3D 씬 =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080706);
scene.fog = new THREE.FogExp2(0x080706, 0.016);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 6, 24);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('scene').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.getElementById('scene').appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 60;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(0, 0.5, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const pl1 = new THREE.PointLight(0xd4af37, 90, 60); pl1.position.set(10, 12, 10); scene.add(pl1);
const pl2 = new THREE.PointLight(0x5b8fd6, 40, 60); pl2.position.set(-12, -4, -8); scene.add(pl2);

const PC = 600, ppos = new Float32Array(PC*3);
for(let i=0;i<PC;i++){ ppos[i*3]=(Math.random()-0.5)*50; ppos[i*3+1]=(Math.random()-0.5)*40; ppos[i*3+2]=(Math.random()-0.5)*30; }
const pgeo = new THREE.BufferGeometry(); pgeo.setAttribute('position', new THREE.BufferAttribute(ppos,3));
scene.add(new THREE.Points(pgeo, new THREE.PointsMaterial({ color:0xd4af37, size:0.05, transparent:true, opacity:0.5, depthWrite:false, blending:THREE.AdditiveBlending })));

// ================= 트리 레이아웃 + 노드/엣지 =================
const RADIUS = 5.6;
function layout(node, depth, angle, spread){
  const r = depth===0 ? 0 : RADIUS * depth;
  node._pos = new THREE.Vector3(r*Math.cos(angle), depth===0 ? 1.6 : (depth===2 ? angle*0.3 : 0.6), r*Math.sin(angle));
  const kids = node.children||[];
  if(!kids.length) return;
  if(kids.length===1){ layout(kids[0], depth+1, angle, spread); return; }
  kids.forEach((k,i)=>{ const a = angle + spread*(i/(kids.length-1)-0.5); layout(k, depth+1, a, spread*0.7); });
}

const COLORS = { root:0xd4af37, trail:0x3db8a8, case:0xe85d4c, leaf:0xc9a96e };
const nodeMeshes = [];
const allNodes = [];

function collect(node, parent){
  allNodes.push(node);
  const c = COLORS[node.type] || COLORS.leaf;
  const size = node.type==='root'?1.1 : node.type==='case'?0.85 : node.type==='trail'?0.7 : 0.5;
  const m = new THREE.Mesh(new THREE.SphereGeometry(size,32,32),
    new THREE.MeshStandardMaterial({ color:c, roughness:0.35, metalness:0.55, emissive:c, emissiveIntensity: node.type==='case'?0.45:0.25 }));
  m.position.copy(node._pos); m.userData = node; scene.add(m); nodeMeshes.push(m);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ color:c, transparent:true, opacity:0.16, depthWrite:false, blending:THREE.AdditiveBlending }));
  halo.scale.set(size*4.5, size*4.5, 1); halo.position.copy(node._pos); scene.add(halo);
  const lbl = document.createElement('div');
  lbl.className = 'node-label' + (node.type==='root'?' root':'') + (node.type==='case'?' case':'');
  lbl.textContent = (node.icon?node.icon+' ':'') + node.label;
  const lab = new CSS2DObject(lbl); lab.position.copy(node._pos); lab.position.y += (node.type==='root'?2.2:1.1); scene.add(lab);
  lbl.addEventListener('click', ()=>openPanel(node));
  if(parent){ const gp = new THREE.BufferGeometry().setFromPoints([parent._pos, node._pos]);
    scene.add(new THREE.Line(gp, new THREE.LineBasicMaterial({ color:c, transparent:true, opacity:0.35 }))); }
  (node.children||[]).forEach(k=>collect(k, node));
}

// ================= 패널 =================
const panel = document.getElementById('panel');
const pIco = document.getElementById('pIco'), pCrumb = document.getElementById('pCrumb'), pTitle = document.getElementById('pTitle'), pBody = document.getElementById('pBody');
const pClose = document.getElementById('pClose');

function openPanel(node){
  pIco.textContent = node.icon||'📄';
  pCrumb.textContent = (node.type==='root'?'연구소': node.type==='case'?'케이스 · 연구': node.type==='trail'?'연구 과제 트레일':'세부 분석');
  pTitle.textContent = node.label;
  pBody.innerHTML = node.content||'';
  if(node.id==='price-data'){ const t = document.getElementById('price-tbl'); if(t) t.innerHTML = '<tr><th>메뉴</th><th>판매가</th><th>원가</th><th>마진율</th></tr>' + priceTable(); }
  if(document.getElementById('c_cost')) window.cc();
  panel.classList.add('open');
  controls.autoRotate = false;
}
pClose.addEventListener('click', ()=>{ panel.classList.remove('open'); controls.autoRotate = true; });

window.cc = function(){
  const g = id => document.getElementById(id);
  const cost = parseFloat(g('c_cost').value)||0, price = parseFloat(g('c_price').value)||0, target = parseFloat(g('c_target').value)||0;
  const rate = price>0 ? cost/price*100 : 0, margin = price-cost, mrate = price>0 ? margin/price*100 : 0;
  const suggest = (target>0 && target<100) ? Math.round(cost/(1-target/100)) : 0;
  g('c_rate').textContent = rate.toFixed(1)+'%';
  g('c_margin').textContent = margin.toLocaleString('ko-KR')+'원';
  g('c_mrate').textContent = mrate.toFixed(1)+'%';
  g('c_suggest').textContent = suggest.toLocaleString('ko-KR')+'원';
};

// ================= 초기화 (데이터 → 그래프) =================
async function init(){
  try{
    const onto = await loadOntology();
    TREE = buildTree(onto);
    // 매장 노드 → stores.json 실데이터 주입
    TREE && (()=>{
      const walk = n => { if(n.storeId){ const s = (storesData?.stores||[]).find(x=>x.id===n.storeId); n.content = storeContent(s); } (n.children||[]).forEach(walk); };
      walk(TREE);
    })();
    document.getElementById('srcStatus').innerHTML = 'ontology.json<br>stores.json';
    layout(TREE, 0, -Math.PI/2, Math.PI*1.7);
    collect(TREE, null);
    setTimeout(()=>{ const c = allNodes.find(n=>n.id==='case-chimsaem'); if(c) openPanel(c); }, 800);
  }catch(e){
    document.getElementById('srcStatus').textContent = '로드 실패: '+e.message;
  }
  document.getElementById('boot').classList.add('hide');
}
init();

// ================= 애니메이션 =================
const clock = new THREE.Clock();
(function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  nodeMeshes.forEach(m=>{ if(m.userData.type==='case') m.scale.setScalar(1 + Math.sin(t*3)*0.08); });
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
})();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

if('serviceWorker' in navigator) addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
